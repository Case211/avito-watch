name: CLA

# Подпись соглашения контрибьютора: бот просит подписать CLA комментарием в PR, подписи хранит в ветке cla-signatures.
# pull_request_target даёт права на запись и для PR из форков — код PR здесь не запускается и не скачивается
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Case211/avito-watch/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: Case211,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Спасибо за PR! Прежде чем его принять, нужно подписать
            [соглашение контрибьютора (CLA)](https://github.com/Case211/avito-watch/blob/main/CLA.md): права на код
            остаются у вас, а проект получает право распространять его, в том числе под другими лицензиями. Чтобы
            подписать, оставьте в этом PR комментарий ровно с текстом ниже.<br/>
            Thanks for your PR! Please sign our CLA by posting a comment with the exact text below.<br/>
          custom-allsigned-prcomment: Все авторы подписали CLA ✍️ ✅ All contributors have signed the CLA.
          create-file-commit-message: Файл подписей CLA
          signed-commit-message: $contributorName подписывает CLA в $owner/$repo#$pullRequestNo
